<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamezzy Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 20px;
    color: #4ade80;
    font: 700 20px system-ui, sans-serif;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    pointer-events: none; z-index: 10;
  }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0f; color: #4ade80;
    font: 700 22px system-ui, sans-serif;
    z-index: 100;
  }
</style>
</head>
<body>
<div id="loading">Loading world…</div>
<div id="hud">SCORE: <span id="score">0</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// 1. SCENE, CAMERA, RENDERER
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1f);
scene.fog = new THREE.Fog(0x0a0a1f, 40, 110);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  300
);
camera.position.set(0, 4.5, -8);
camera.lookAt(0, 1.5, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ============================================================
// 2. LIGHTING
// ============================================================
scene.add(new THREE.AmbientLight(0x8899ff, 0.7));

const moon = new THREE.DirectionalLight(0xffffff, 1.2);
moon.position.set(-15, 25, -10);
moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
moon.shadow.camera.left = -25;
moon.shadow.camera.right = 25;
moon.shadow.camera.top = 25;
moon.shadow.camera.bottom = -25;
scene.add(moon);

const rimLight = new THREE.DirectionalLight(0x22d3ee, 0.6);
rimLight.position.set(15, 10, 25);
scene.add(rimLight);

// ============================================================
// 3. THE ROAD
// ============================================================
const ROAD_WIDTH = 9;
const ROAD_LENGTH = 500;

const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH);
const roadMat = new THREE.MeshStandardMaterial({
  color: 0x252540,
  roughness: 0.9,
  metalness: 0.1
});
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0, ROAD_LENGTH / 2 - 30);
road.receiveShadow = true;
scene.add(road);

// Glowing lane divider lines
for (let lane = -1; lane <= 1; lane += 2) {
  const lineGeo = new THREE.PlaneGeometry(0.18, ROAD_LENGTH);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee });
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.rotation.x = -Math.PI / 2;
  line.position.set(lane * (ROAD_WIDTH / 3), 0.01, ROAD_LENGTH / 2 - 30);
  scene.add(line);
}

// ============================================================
// 4. SIDE PILLARS (temple corridor)
// ============================================================
const PILLAR_COUNT = 30;
const PILLAR_SPACING = 14;
const pillars = [];

const pillarGeo = new THREE.BoxGeometry(1.6, 7, 1.6);
const pillarMat = new THREE.MeshStandardMaterial({
  color: 0x4a3a6a,
  roughness: 0.85,
  emissive: 0x1a0a2a,
  emissiveIntensity: 0.5
});

const capGeo = new THREE.BoxGeometry(2.0, 0.3, 2.0);
const capMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee });

for (let i = 0; i < PILLAR_COUNT; i++) {
  for (let side = -1; side <= 1; side += 2) {
    const p = new THREE.Mesh(pillarGeo, pillarMat);
    p.position.set(side * (ROAD_WIDTH / 2 + 1.8), 3.5, i * PILLAR_SPACING);
    p.castShadow = true;
    p.receiveShadow = true;
    scene.add(p);
    pillars.push(p);

    const cap = new THREE.Mesh(capGeo, capMat);
    cap.position.set(p.position.x, 7.15, p.position.z);
    scene.add(cap);
    p.userData.cap = cap;
  }
}

// ============================================================
// 5. THE CHARACTER (orange T-shirt with DP logo)
// ============================================================
const character = new THREE.Group();
character.position.set(0, 0, 0);
scene.add(character);

// Body — orange T-shirt torso
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0xff6a1a,
  emissive: 0x3a1000,
  emissiveIntensity: 0.4,
  roughness: 0.6
});
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.45, 0.85, 8, 16), bodyMat);
body.position.y = 1.2;
body.castShadow = true;
character.add(body);

// DP logo on the BACK of the shirt
const dpCanvas = document.createElement('canvas');
dpCanvas.width = dpCanvas.height = 128;
const dpx = dpCanvas.getContext('2d');
dpx.fillStyle = '#0a0a1f';
dpx.fillRect(0, 0, 128, 128);
dpx.fillStyle = '#ffffff';
dpx.font = 'bold 60px system-ui, sans-serif';
dpx.textAlign = 'center';
dpx.textBaseline = 'middle';
dpx.fillText('DP', 64, 68);
const dpTex = new THREE.CanvasTexture(dpCanvas);
const dpLogo = new THREE.Mesh(
  new THREE.PlaneGeometry(0.6, 0.6),
  new THREE.MeshBasicMaterial({ map: dpTex, transparent: true })
);
dpLogo.position.set(0, 1.3, -0.47);
dpLogo.rotation.y = Math.PI;
character.add(dpLogo);

// Head
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.32, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xf0c090, roughness: 0.7 })
);
head.position.y = 2.0;
head.castShadow = true;
character.add(head);

// Legs
const legGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.7, 8);
const legMat = new THREE.MeshStandardMaterial({ color: 0x222244 });
const leftLeg = new THREE.Mesh(legGeo, legMat);
leftLeg.position.set(-0.18, 0.35, 0);
leftLeg.castShadow = true;
character.add(leftLeg);

const rightLeg = new THREE.Mesh(legGeo, legMat);
rightLeg.position.set(0.18, 0.35, 0);
rightLeg.castShadow = true;
character.add(rightLeg);

// Arms
const armGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.8, 8);
const armMat = new THREE.MeshStandardMaterial({ color: 0xff6a1a });
const leftArm = new THREE.Mesh(armGeo, armMat);
leftArm.position.set(-0.55, 1.2, 0);
leftArm.castShadow = true;
character.add(leftArm);

const rightArm = new THREE.Mesh(armGeo, armMat);
rightArm.position.set(0.55, 1.2, 0);
rightArm.castShadow = true;
character.add(rightArm);

// Shadow blob
const blob = new THREE.Mesh(
  new THREE.CircleGeometry(0.65, 24),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 })
);
blob.rotation.x = -Math.PI / 2;
blob.position.y = 0.02;
character.add(blob);

// ============================================================
// 6. GROUND RUNNING STRIPES (speed feedback)
// ============================================================
const stripes = [];
const stripeGeo = new THREE.PlaneGeometry(0.5, 3);
const stripeMat = new THREE.MeshBasicMaterial({
  color: 0x22d3ee, transparent: true, opacity: 0.4
});
for (let i = 0; i < 60; i++) {
  const s = new THREE.Mesh(stripeGeo, stripeMat);
  s.rotation.x = -Math.PI / 2;
  s.position.set(
    (Math.floor(Math.random() * 3) - 1) * (ROAD_WIDTH / 3),
    0.015,
    i * 8
  );
  scene.add(s);
  stripes.push(s);
}

// ============================================================
// 7. GAME STATE + LOOP
// ============================================================
let speed = 14;
let score = 0;
let time = 0;
const scoreEl = document.getElementById('score');
const clock = new THREE.Clock();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  const delta = speed * dt;
  score += delta * 0.8;
  scoreEl.textContent = Math.floor(score);

  // Scroll pillars toward camera
  pillars.forEach(p => {
    p.position.z -= delta;
    if (p.userData.cap) p.userData.cap.position.z = p.position.z;
    if (p.position.z < -25) {
      p.position.z += PILLAR_COUNT * PILLAR_SPACING;
      if (p.userData.cap) p.userData.cap.position.z = p.position.z;
    }
  });

  // Scroll stripes
  stripes.forEach(s => {
    s.position.z -= delta;
    if (s.position.z < -15) s.position.z += 480;
  });

  // Animate legs + arms (running cycle)
  const swing = Math.sin(time * 15) * 0.55;
  leftLeg.rotation.x = swing;
  rightLeg.rotation.x = -swing;
  leftArm.rotation.x = -swing;
  rightArm.rotation.x = swing;

  // Body bob
  const bob = Math.abs(Math.sin(time * 15)) * 0.06;
  body.position.y = 1.2 + bob;
  head.position.y = 2.0 + bob;
  dpLogo.position.y = 1.3 + bob;

  // Camera sway
  camera.position.x = Math.sin(time * 2) * 0.18;
  camera.lookAt(0, 1.5, 15);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// ============================================================
// 8. RESIZE
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// 9. BOOT
// ============================================================
document.getElementById('loading').remove();
animate();
</script>
</body>
</html>
