<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamezzy Runner — Lanka</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 20px;
    color: #ff7a00; font: 800 22px system-ui, sans-serif;
    text-shadow: 0 0 16px rgba(255,120,0,0.9), 0 2px 12px rgba(0,0,0,1);
    pointer-events: none; z-index: 10; letter-spacing: 1px;
  }
  #hud .label { color: #ffcc99; font-size: 13px; font-weight: 600; }
  #hud .lives { color: #ff5566; margin-left: 16px; }
  #zone {
    position: fixed; top: 16px; right: 20px;
    color: #ffcc44; font: 800 20px system-ui, sans-serif;
    text-shadow: 0 0 12px rgba(255,180,0,0.9), 0 2px 10px rgba(0,0,0,1);
    pointer-events: none; z-index: 10; letter-spacing: 3px;
    text-transform: uppercase; transition: opacity 0.5s;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000; color: #ff7a00; font: 800 24px system-ui, sans-serif;
    z-index: 100; letter-spacing: 2px;
  }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,200,80,0.85); font: 600 15px system-ui, sans-serif;
    text-shadow: 0 2px 8px #000; pointer-events: none; z-index: 10;
    transition: opacity 0.6s; letter-spacing: 1px; text-align: center;
  }
  #gameover {
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85); color: #ff7a00;
    font: 800 32px system-ui, sans-serif; z-index: 200;
    letter-spacing: 3px; text-align: center;
  }
  #gameover .final { font-size: 22px; margin-top: 20px; color: #fff; }
  #gameover button {
    margin-top: 30px; padding: 14px 36px; font-size: 18px; font-weight: 800;
    background: #ff7a00; color: #000; border: none; border-radius: 10px;
    cursor: pointer; letter-spacing: 2px;
  }
</style>
</head>
<body>
<div id="loading">GAMEZZY RUNNER · LANKA</div>
<div id="hud">
  <span class="label">SCORE</span> <span id="score">0</span>
  <span class="lives">❤ <span id="lives">3</span></span>
</div>
<div id="zone">BEACH</div>
<div id="hint">← → switch lanes · ↓ slide · swipe works too</div>
<div id="gameover">
  <div>GAME OVER</div>
  <div class="final">SCORE: <span id="finalScore">0</span></div>
  <button id="retryBtn">PLAY AGAIN</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const ZONES = [
  { name: 'BEACH',   skyTop: 0x0a1a4a, skyMid: 0x3a6aaa, skyHorizon: 0xffaa55,
    fog: 0x2a2a4a, fogDensity: 0.020, ambient: 0x443355, sun: 0xffbb77,
    roadColor: 0x9a7a5a, lineColor: 0xffdd66, decor: 'beach', duration: 30 },
  { name: 'JUNGLE',  skyTop: 0x051a10, skyMid: 0x2a5a30, skyHorizon: 0x88cc66,
    fog: 0x0a2010, fogDensity: 0.030, ambient: 0x224422, sun: 0xbbff88,
    roadColor: 0x4a5a3a, lineColor: 0xaaff66, decor: 'jungle', duration: 30 },
  { name: 'TEMPLE',  skyTop: 0x1a0510, skyMid: 0x5a0a0a, skyHorizon: 0xff4400,
    fog: 0x3a0a0a, fogDensity: 0.018, ambient: 0x553300, sun: 0xff7733,
    roadColor: 0x2a1a1a, lineColor: 0xffaa33, decor: 'temple', duration: 30 },
  { name: 'FESTIVAL', skyTop: 0x1a0525, skyMid: 0x5a0a5a, skyHorizon: 0xff44cc,
    fog: 0x2a0a2a, fogDensity: 0.016, ambient: 0x553377, sun: 0xff99ee,
    roadColor: 0x3a2a4a, lineColor: 0xffaaff, decor: 'festival', duration: 30 }
];

let currentZone = 0;
let zoneElapsed = 0;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x2a2a4a, 0.020);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 3.4, -6.5);
camera.lookAt(0, 1.5, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const skyUniforms = {
  topColor: { value: new THREE.Color(0x0a1a4a) },
  midColor: { value: new THREE.Color(0x3a6aaa) },
  horizon:  { value: new THREE.Color(0xffaa55) }
};

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, uniforms: skyUniforms,
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor; uniform vec3 midColor; uniform vec3 horizon;
    varying vec3 vWorldPos;
    void main() {
      float h = normalize(vWorldPos).y;
      vec3 color;
      if (h > 0.0) { color = mix(midColor, topColor, pow(h, 0.55)); }
      else { color = mix(midColor, horizon, pow(-h, 0.45)); }
      float band = exp(-abs(h) * 12.0);
      color += horizon * band * 0.5;
      vec3 dir = normalize(vWorldPos);
      float star = step(0.9985, fract(sin(dot(dir.xy, vec2(12.9898, 78.233))) * 43758.5453));
      color += vec3(star * 0.55);
      gl_FragColor = vec4(color, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 24), skyMat));

const ambientLight = new THREE.AmbientLight(0x443355, 0.7);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffbb77, 1.7);
sunLight.position.set(-12, 12, 25);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -25;
sunLight.shadow.camera.right = 25;
sunLight.shadow.camera.top = 25;
sunLight.shadow.camera.bottom = -25;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 100;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

const backRim = new THREE.DirectionalLight(0x442200, 0.4);
backRim.position.set(0, 5, -20);
scene.add(backRim);

const voidGround = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 1 })
);
voidGround.rotation.x = -Math.PI / 2;
voidGround.position.y = -0.05;
voidGround.receiveShadow = true;
scene.add(voidGround);

function makeRoadTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#0a0a0e';
  x.fillRect(0, 0, size, size);
  const tiles = 6, tileSize = size / tiles;
  for (let i = 0; i < tiles; i++) {
    for (let j = 0; j < tiles; j++) {
      const shade = 12 + Math.random() * 20;
      x.fillStyle = 'rgb(' + (shade + 8) + ',' + shade + ',' + (shade + 6) + ')';
      x.fillRect(i * tileSize + 2, j * tileSize + 2, tileSize - 4, tileSize - 4);
      x.strokeStyle = 'rgba(255, 180, 90, ' + (0.12 + Math.random() * 0.15) + ')';
      x.lineWidth = 1;
      x.strokeRect(i * tileSize + 2, j * tileSize + 2, tileSize - 4, tileSize - 4);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 40);
  tex.anisotropy = 8;
  return tex;
}

const ROAD_WIDTH = 10;
const ROAD_LENGTH = 700;
const LANE_X = [-ROAD_WIDTH / 3, 0, ROAD_WIDTH / 3];

const roadMaterial = new THREE.MeshStandardMaterial({
  map: makeRoadTexture(), roughness: 0.75, metalness: 0.15, color: 0xffffff
});

const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH), roadMaterial);
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.01, ROAD_LENGTH / 2 - 30);
road.receiveShadow = true;
scene.add(road);

const laneLineMat = new THREE.MeshBasicMaterial({ color: 0xffdd66 });
for (let lane = -1; lane <= 1; lane += 2) {
  const line = new THREE.Mesh(new THREE.PlaneGeometry(0.18, ROAD_LENGTH), laneLineMat);
  line.rotation.x = -Math.PI / 2;
  line.position.set(lane * (ROAD_WIDTH / 3), 0.03, ROAD_LENGTH / 2 - 30);
  scene.add(line);
}

const PILLAR_COUNT = 30;
const PILLAR_SPACING = 16;
const pillars = [];

const pillarMat = new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.9, metalness: 0.1 });
const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa33 });

for (let i = 0; i < PILLAR_COUNT; i++) {
  for (let side = -1; side <= 1; side += 2) {
    const group = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.6, 2.4), pillarMat);
    base.position.y = 0.3; base.castShadow = true; base.receiveShadow = true;
    group.add(base);
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.0, 7, 8), pillarMat);
    shaft.position.y = 4.1; shaft.castShadow = true; shaft.receiveShadow = true;
    group.add(shaft);
    for (let r = 0; r < 3; r++) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.06, 8, 20), glowMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 1.5 + r * 2.5;
      group.add(ring);
    }
    const cap = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.5, 2.5), pillarMat);
    cap.position.y = 7.9; cap.castShadow = true;
    group.add(cap);
    const glowTop = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.1, 2.6), glowMat);
    glowTop.position.y = 8.19;
    group.add(glowTop);
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffdd55 }));
    lamp.position.y = 8.55;
    group.add(lamp);
    const light = new THREE.PointLight(0xffbb55, 1.0, 14);
    light.position.y = 8.55;
    group.add(light);
    group.userData.lamp = lamp;
    group.position.set(side * (ROAD_WIDTH / 2 + 2.2), 0, i * PILLAR_SPACING);
    scene.add(group);
    pillars.push(group);
  }
}

// ============================================================
// DECORATIONS — palms, vines, flags, lanterns
// ============================================================
const ZONE_DECOR_COUNT = 16;
const zoneDecorations = { beach: [], jungle: [], temple: [], festival: [] };

function makePalmTree(side) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.35, 6, 8),
    new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.9 })
  );
  trunk.position.y = 3; trunk.castShadow = true; g.add(trunk);
  const frondMat = new THREE.MeshStandardMaterial({ color: 0x1a4a20, roughness: 0.8 });
  for (let i = 0; i < 6; i++) {
    const frond = new THREE.Mesh(new THREE.ConeGeometry(0.4, 2.4, 4), frondMat);
    frond.position.set(Math.cos(i * 1.05) * 0.6, 6.1, Math.sin(i * 1.05) * 0.6);
    frond.rotation.z = Math.PI / 3 * Math.cos(i * 1.05);
    frond.rotation.x = Math.PI / 3 * Math.sin(i * 1.05);
    g.add(frond);
  }
  g.position.set(side * (ROAD_WIDTH / 2 + 4), 0, 0);
  return g;
}

function makeJungleVine(side) {
  const g = new THREE.Group();
  const vineMat = new THREE.MeshStandardMaterial({ color: 0x2a5a2a, roughness: 0.9 });
  for (let i = 0; i < 4; i++) {
    const vine = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.06, 4 + Math.random() * 3, 6),
      vineMat
    );
    vine.position.set(side * (ROAD_WIDTH / 2 + 1 + Math.random() * 2), 5, (Math.random() - 0.5) * 3);
    vine.rotation.z = (Math.random() - 0.5) * 0.4;
    g.add(vine);
  }
  return g;
}

function makeTempleFlag(side) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.08, 5, 8),
    new THREE.MeshStandardMaterial({ color: 0x3a1a0a, roughness: 0.8 })
  );
  pole.position.y = 2.5;
  g.add(pole);
  const colors = [0x2244cc, 0xffcc00, 0xcc2222, 0xffffff, 0xff7700];
  colors.forEach((col, i) => {
    const stripe = new THREE.Mesh(
      new THREE.PlaneGeometry(0.9, 0.2),
      new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide })
    );
    stripe.position.set(0.5, 4.4 - i * 0.22, 0);
    g.add(stripe);
  });
  g.position.set(side * (ROAD_WIDTH / 2 + 3.5), 0, 0);
  return g;
}

function makeLantern(side) {
  const g = new THREE.Group();
  const lanternColors = [0xff4466, 0xffaa22, 0xff66cc, 0x66ff88, 0x66ddff];
  const col = lanternColors[Math.floor(Math.random() * lanternColors.length)];
  const lantern = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 12, 12),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.9 })
  );
  lantern.position.y = 6;
  const innerLight = new THREE.PointLight(col, 1.2, 10);
  innerLight.position.y = 6;
  g.add(lantern);
  g.add(innerLight);
  g.position.set(side * (ROAD_WIDTH / 2 + 2.5), 0, 0);
  return g;
}

for (let i = 0; i < ZONE_DECOR_COUNT; i++) {
  for (let side = -1; side <= 1; side += 2) {
    const palm = makePalmTree(side);
    palm.position.z = i * 18; palm.visible = false;
    scene.add(palm); zoneDecorations.beach.push(palm);

    const vine = makeJungleVine(side);
    vine.position.z = i * 18; vine.visible = false;
    scene.add(vine); zoneDecorations.jungle.push(vine);

    const flag = makeTempleFlag(side);
    flag.position.z = i * 18; flag.visible = false;
    scene.add(flag); zoneDecorations.temple.push(flag);

    const lantern = makeLantern(side);
    lantern.position.z = i * 18; lantern.visible = false;
    scene.add(lantern); zoneDecorations.festival.push(lantern);
  }
}

function setZoneDecorVisible(zoneKey) {
  Object.keys(zoneDecorations).forEach(key => {
    zoneDecorations[key].forEach(d => {
      d.visible = (key === zoneKey);
    });
  });
}

// ============================================================
// CHARACTER
// ============================================================
const character = new THREE.Group();
character.position.set(0, 0, 0);
character.scale.setScalar(1.15);
scene.add(character);

const SHIRT_COLOR = 0xff7a00;
const SKIN_COLOR = 0xf0b088;
const PANTS_COLOR = 0x101018;

const shirtMat = new THREE.MeshStandardMaterial({ color: SHIRT_COLOR, roughness: 0.55, emissive: 0x220800, emissiveIntensity: 0.6 });
const skinMat = new THREE.MeshStandardMaterial({ color: SKIN_COLOR, roughness: 0.75 });
const pantsMat = new THREE.MeshStandardMaterial({ color: PANTS_COLOR, roughness: 0.9 });
const shoeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.5 });

const hips = new THREE.Group();
hips.position.y = 0.95;
character.add(hips);

const torso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.85, 0.42), shirtMat);
torso.position.y = 0.42;
torso.castShadow = true;
hips.add(torso);

const lotusCanvas = document.createElement('canvas');
lotusCanvas.width = lotusCanvas.height = 128;
const lx = lotusCanvas.getContext('2d');
lx.clearRect(0, 0, 128, 128);
lx.strokeStyle = '#ffdd44';
lx.lineWidth = 5;
lx.beginPath();
lx.arc(64, 64, 40, 0, Math.PI * 2);
lx.stroke();
lx.fillStyle = '#ffffff';
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  lx.beginPath();
  lx.ellipse(64 + Math.cos(a) * 20, 64 + Math.sin(a) * 20, 10, 6, a, 0, Math.PI * 2);
  lx.fill();
}
const lotusTex = new THREE.CanvasTexture(lotusCanvas);
const lotus = new THREE.Mesh(
  new THREE.PlaneGeometry(0.4, 0.4),
  new THREE.MeshBasicMaterial({ map: lotusTex, transparent: true })
);
lotus.position.set(0, 0.42, 0.221);
hips.add(lotus);

const dpCanvas = document.createElement('canvas');
dpCanvas.width = dpCanvas.height = 256;
const dpx = dpCanvas.getContext('2d');
dpx.clearRect(0, 0, 256, 256);
dpx.beginPath();
dpx.arc(128, 128, 95, 0, Math.PI * 2);
dpx.fillStyle = '#000000';
dpx.fill();
dpx.lineWidth = 10;
dpx.strokeStyle = '#ff7a00';
dpx.stroke();
dpx.fillStyle = '#ffffff';
dpx.font = 'bold 100px system-ui, sans-serif';
dpx.textAlign = 'center';
dpx.textBaseline = 'middle';
dpx.fillText('DP', 128, 142);
const dpTex = new THREE.CanvasTexture(dpCanvas);
const dpLogo = new THREE.Mesh(
  new THREE.PlaneGeometry(0.55, 0.55),
  new THREE.MeshBasicMaterial({ map: dpTex, transparent: true })
);
dpLogo.position.set(0, 0.42, -0.221);
dpLogo.rotation.y = Math.PI;
hips.add(dpLogo);

const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.14, 8), skinMat);
neck.position.y = 1.02;
hips.add(neck);

const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.46, 0.42), skinMat);
head.position.y = 1.35;
head.castShadow = true;
hips.add(head);

const hair = new THREE.Mesh(
  new THREE.BoxGeometry(0.46, 0.14, 0.46),
  new THREE.MeshStandardMaterial({ color: 0x1a0f08, roughness: 0.95 })
);
hair.position.y = 1.58;
hips.add(hair);

function makeArm(side) {
  const arm = new THREE.Group();
  arm.position.set(side * 0.5, 0.85, 0);
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.45, 8), shirtMat);
  upper.position.y = -0.22; upper.castShadow = true; arm.add(upper);
  const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.42, 8), skinMat);
  lower.position.y = -0.65; lower.castShadow = true; arm.add(lower);
  const hand = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.12), skinMat);
  hand.position.y = -0.9; hand.castShadow = true; arm.add(hand);
  hips.add(arm);
  return arm;
}
const leftArm = makeArm(-1);
const rightArm = makeArm(1);

function makeLeg(side) {
  const leg = new THREE.Group();
  leg.position.set(side * 0.19, 0, 0);
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.11, 0.5, 8), pantsMat);
  upper.position.y = -0.28; upper.castShadow = true; leg.add(upper);
  const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.45, 8), pantsMat);
  lower.position.y = -0.78; lower.castShadow = true; leg.add(lower);
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.13, 0.36), shoeMat);
  shoe.position.set(0, -1.04, 0.07); shoe.castShadow = true; leg.add(shoe);
  hips.add(leg);
  return leg;
}
const leftLeg = makeLeg(-1);
const rightLeg = makeLeg(1);

const blob = new THREE.Mesh(
  new THREE.CircleGeometry(0.75, 32),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.65 })
);
blob.rotation.x = -Math.PI / 2;
blob.position.y = 0.01;
character.add(blob);

const stripes = [];
const stripeGeo = new THREE.PlaneGeometry(0.5, 3.5);
const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0.4 });
for (let i = 0; i < 80; i++) {
  const s = new THREE.Mesh(stripeGeo, stripeMat);
  s.rotation.x = -Math.PI / 2;
  s.position.set((Math.floor(Math.random() * 3) - 1) * (ROAD_WIDTH / 3), 0.04, i * 8);
  scene.add(s);
  stripes.push(s);
}

// ============================================================
// GAMEPLAY OBJECTS — Coins, Pylons, Fascia Signs, DP Truck
// ============================================================
const gameplayObjects = [];

// ---- COIN ----
const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 16);
const coinMat = new THREE.MeshStandardMaterial({
  color: 0xffcc22, emissive: 0xff8800, emissiveIntensity: 0.7,
  metalness: 0.9, roughness: 0.3
});

function spawnCoin(lane, zPos) {
  const coin = new THREE.Mesh(coinGeo, coinMat);
  coin.rotation.x = Math.PI / 2;
  coin.position.set(LANE_X[lane], 1.0, zPos);
  coin.userData = { type: 'coin', lane: lane, spin: Math.random() * Math.PI * 2 };
  scene.add(coin);
  gameplayObjects.push(coin);
}

// ---- PYLON (traffic cone) ----
const pylonMat = new THREE.MeshStandardMaterial({
  color: 0xff5500, emissive: 0x441100, emissiveIntensity: 0.8, roughness: 0.6
});
const pylonStripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

function spawnPylon(lane, zPos) {
  const g = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.9, 8), pylonMat);
  cone.position.y = 0.45;
  cone.castShadow = true;
  g.add(cone);
  const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.12, 8), pylonStripeMat);
  stripe.position.y = 0.45;
  g.add(stripe);
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.1, 0.7), pylonMat);
  base.position.y = 0.05;
  g.add(base);
  g.position.set(LANE_X[lane], 0, zPos);
  g.userData = { type: 'pylon', lane: lane };
  scene.add(g);
  gameplayObjects.push(g);
}

// ---- FASCIA SIGN (overhead) ----
const signMat = new THREE.MeshStandardMaterial({
  color: 0xcc2200, emissive: 0x660000, emissiveIntensity: 0.7, roughness: 0.6
});
const signTextMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

function spawnFascia(lane, zPos) {
  const g = new THREE.Group();
  // Pole
  const poleMat2 = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
  const poleL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4, 8), poleMat2);
  poleL.position.set(-1.2, 2, 0);
  g.add(poleL);
  const poleR = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4, 8), poleMat2);
  poleR.position.set(1.2, 2, 0);
  g.add(poleR);
  // Sign board
  const board = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.9, 0.15), signMat);
  board.position.set(0, 4.3, 0);
  board.castShadow = true;
  g.add(board);
  // "STOP" strip (visual only)
  const strip = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.12), signTextMat);
  strip.position.set(0, 4.3, 0.08);
  g.add(strip);
  g.position.set(LANE_X[lane], 0, zPos);
  g.userData = { type: 'fascia', lane: lane, bottomY: 3.85 };
  scene.add(g);
  gameplayObjects.push(g);
}

// ---- DP TRUCK MONSTER ----
const truckGroup = new THREE.Group();
truckGroup.visible = false;

// Truck body
const truckBody = new THREE.Mesh(
  new THREE.BoxGeometry(3.2, 2.2, 4.5),
  new THREE.MeshStandardMaterial({ color: 0x1a0a0a, roughness: 0.7, metalness: 0.4, emissive: 0x220000, emissiveIntensity: 0.6 })
);
truckBody.position.y = 1.4;
truckBody.castShadow = true;
truckGroup.add(truckBody);

// Cab
const cab = new THREE.Mesh(
  new THREE.BoxGeometry(3.0, 1.6, 2.2),
  new THREE.MeshStandardMaterial({ color: 0x2a0a0a, roughness: 0.6, metalness: 0.5 })
);
cab.position.set(0, 1.1, 2.6);
cab.castShadow = true;
truckGroup.add(cab);

// Windshield
const windshield = new THREE.Mesh(
  new THREE.PlaneGeometry(2.6, 1.0),
  new THREE.MeshBasicMaterial({ color: 0x110000 })
);
windshield.position.set(0, 1.5, 3.71);
truckGroup.add(windshield);

// Glowing red eyes (the "monster" part)
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), eyeMat);
eyeL.position.set(-0.7, 1.6, 3.72);
truckGroup.add(eyeL);
const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), eyeMat);
eyeR.position.set(0.7, 1.6, 3.72);
truckGroup.add(eyeR);

// Orange headlights
const headL = new THREE.PointLight(0xff6600, 3, 12);
headL.position.set(-1, 0.8, 4);
truckGroup.add(headL);
const headR = new THREE.PointLight(0xff6600, 3, 12);
headR.position.set(1, 0.8, 4);
truckGroup.add(headR);

// Big DP logo on the front of the cab
const truckDPCanvas = document.createElement('canvas');
truckDPCanvas.width = truckDPCanvas.height = 256;
const tdx = truckDPCanvas.getContext('2d');
tdx.clearRect(0, 0, 256, 256);
tdx.beginPath();
tdx.arc(128, 128, 110, 0, Math.PI * 2);
tdx.fillStyle = '#000000';
tdx.fill();
tdx.lineWidth = 14;
tdx.strokeStyle = '#ff2200';
tdx.stroke();
tdx.fillStyle = '#ff2200';
tdx.font = 'bold 130px system-ui, sans-serif';
tdx.textAlign = 'center';
tdx.textBaseline = 'middle';
tdx.fillText('DP', 128, 145);
const truckDPTex = new THREE.CanvasTexture(truckDPCanvas);
const truckDP = new THREE.Mesh(
  new THREE.PlaneGeometry(1.8, 1.8),
  new THREE.MeshBasicMaterial({ map: truckDPTex, transparent: true })
);
truckDP.position.set(0, 1.4, 3.71);
truckGroup.add(truckDP);

// Big chunky wheels
const wheelGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.5, 12);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.9 });
function addWheel(x, z) {
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.rotation.z = Math.PI / 2;
  w.position.set(x, 0.55, z);
  w.castShadow = true;
  truckGroup.add(w);
}
addWheel(-1.7, -1.5);
addWheel(1.7, -1.5);
addWheel(-1.7, 2.4);
addWheel(1.7, 2.4);

truckGroup.position.set(0, 0, -12);
scene.add(truckGroup);

// ============================================================
// SPAWNING LOGIC
// ============================================================
let spawnZ = 60;              // where new objects appear ahead
let nextSpawnDistance = 10;   // distance until next spawn
let lastFasciaZ = -100;       // avoid stacking fascias too close

function spawnWave() {
  const roll = Math.random();

  if (roll < 0.45) {
    // Coin trail
    const lane = Math.floor(Math.random() * 3);
    const count = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count; i++) {
      spawnCoin(lane, spawnZ + i * 1.8);
    }
  } else if (roll < 0.78) {
    // Pylon(s) — leave at least 1 lane open
    const blockCount = Math.random() < 0.35 ? 2 : 1;
    const openLane = Math.floor(Math.random() * 3);
    const lanes = [0, 1, 2].filter(l => l !== openLane);
    for (let i = 0; i < blockCount; i++) {
      spawnPylon(lanes[i], spawnZ);
    }
  } else {
    // Fascia sign (overhead) — only if enough distance since last
    if (spawnZ - lastFasciaZ > 30) {
      const lane = Math.floor(Math.random() * 3);
      spawnFascia(lane, spawnZ);
      lastFasciaZ = spawnZ;
    }
  }
}

// ============================================================
// GAME STATE
// ============================================================
let speed = 15;
let baseSpeed = 15;
let score = 0;
let lives = 3;
let time = 0;
let slideTimer = 0;
let hitCooldown = 0;
let truckActive = false;
let truckChaseTime = 0;
let gameOver = false;

let currentLane = 1;
let targetLaneX = LANE_X[currentLane];
let currentX = LANE_X[currentLane];
const LANE_SWITCH_SPEED = 12;
const MAX_TILT = 0.35;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const zoneEl = document.getElementById('zone');
const gameOverEl = document.getElementById('gameover');
const finalScoreEl = document.getElementById('finalScore');
const retryBtn = document.getElementById('retryBtn');

const clock = new THREE.Clock();
const CAM_BASE = new THREE.Vector3(0, 3.4, -6.5);

// ============================================================
// INPUT
// ============================================================
function switchLane(direction) {
  if (gameOver) return;
  const next = currentLane + direction;
  if (next < 0 || next > 2) return;
  currentLane = next;
  targetLaneX = LANE_X[currentLane];
  const hint = document.getElementById('hint');
  if (hint) hint.style.opacity = '0';
}

function startSlide() {
  if (gameOver) return;
  slideTimer = 0.6;
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    e.preventDefault(); switchLane(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    e.preventDefault(); switchLane(1);
  } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
    e.preventDefault(); startSlide();
  }
});

let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
    switchLane(dx > 0 ? 1 : -1);
  } else if (dy > 50 && Math.abs(dy) > Math.abs(dx)) {
    startSlide();
  }
});

// ============================================================
// ZONE SWITCHER
// ============================================================
function applyZone(idx) {
  const z = ZONES[idx];
  skyUniforms.topColor.value.setHex(z.skyTop);
  skyUniforms.midColor.value.setHex(z.skyMid);
  skyUniforms.horizon.value.setHex(z.skyHorizon);
  scene.fog.color.setHex(z.fog);
  scene.fog.density = z.fogDensity;
  ambientLight.color.setHex(z.ambient);
  sunLight.color.setHex(z.sun);
  glowMat.color.setHex(z.lineColor);
  laneLineMat.color.setHex(z.lineColor);
  stripeMat.color.setHex(z.lineColor);
  pillarMat.color.setHex(z.roadColor);
  setZoneDecorVisible(z.decor);
  zoneEl.textContent = z.name;
  zoneEl.style.opacity = '1';
  setTimeout(() => { zoneEl.style.opacity = '0.5'; }, 2200);
}

// ============================================================
// COLLISION HELPERS
// ============================================================
function showHitEffect() {
  const flash = document.createElement('div');
  flash.style.cssText = 'position:fixed;inset:0;background:#ff0000;opacity:0.6;pointer-events:none;z-index:50;transition:opacity 0.4s;';
  document.body.appendChild(flash);
  setTimeout(() => { flash.style.opacity = '0'; }, 50);
  setTimeout(() => { flash.remove(); }, 500);
}

function triggerHit() {
  if (hitCooldown > 0) return;
  hitCooldown = 1.5;
  lives--;
  livesEl.textContent = lives;
  showHitEffect();
  speed = baseSpeed * 0.55;
  setTimeout(() => { speed = baseSpeed; }, 800);

  if (lives <= 0) {
    endGame();
    return;
  }

  // Activate truck chase
  if (!truckActive) {
    truckActive = true;
    truckChaseTime = 6.0;
    truckGroup.visible = true;
    truckGroup.position.set(currentX * 0.7, 0, -12);
  } else {
    // Already chased once — second hit = game over
    endGame();
  }
}

function endGame() {
  gameOver = true;
  finalScoreEl.textContent = Math.floor(score);
  gameOverEl.style.display = 'flex';
}

function resetGame() {
  gameOver = false;
  lives = 3; score = 0; time = 0;
  livesEl.textContent = '3';
  scoreEl.textContent = '0';
  gameOverEl.style.display = 'none';
  speed = baseSpeed;
  hitCooldown = 0;
  slideTimer = 0;
  truckActive = false;
  truckGroup.visible = false;

  // Clear gameplay objects
  gameplayObjects.forEach(obj => scene.remove(obj));
  gameplayObjects.length = 0;

  // Reset character
  currentLane = 1;
  targetLaneX = LANE_X[1];
  currentX = LANE_X[1];
  character.position.x = currentX;

  // Reset zone
  zoneElapsed = 0;
  currentZone = 0;
  applyZone(0);
}

retryBtn.addEventListener('click', resetGame);

// ============================================================
// GAME LOOP
// ============================================================
applyZone(0);

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!gameOver) {
    time += dt;
    zoneElapsed += dt;
    if (hitCooldown > 0) hitCooldown -= dt;
    if (slideTimer > 0) slideTimer -= dt;

    if (zoneElapsed >= ZONES[currentZone].duration) {
      zoneElapsed = 0;
      currentZone = (currentZone + 1) % ZONES.length;
      applyZone(currentZone);
    }

    score += speed * dt * 0.9;
    scoreEl.textContent = Math.floor(score);

    const delta = speed * dt;

    // Scroll pillars
    pillars.forEach(p => {
      p.position.z -= delta;
      if (p.position.z < -30) p.position.z += PILLAR_COUNT * PILLAR_SPACING;
      if (p.userData.lamp) {
        const s = 0.55 + Math.sin(time * 8 + p.position.x) * 0.08;
        p.userData.lamp.material.color.setHSL(0.11, 1, s);
      }
    });

    // Scroll zone decorations
    Object.values(zoneDecorations).forEach(arr => {
      arr.forEach(d => {
        d.position.z -= delta;
        if (d.position.z < -20) d.position.z += ZONE_DECOR_COUNT * 18;
      });
    });

    // Scroll stripes
    stripes.forEach(s => {
      s.position.z -= delta;
      if (s.position.z < -15) s.position.z += 640;
    });

    // Spawning
    spawnZ -= delta;
    nextSpawnDistance -= delta;
    if (nextSpawnDistance <= 0) {
      spawnWave();
      nextSpawnDistance = 10 + Math.random() * 6;
    }

    // Update gameplay objects
    for (let i = gameplayObjects.length - 1; i >= 0; i--) {
      const obj = gameplayObjects[i];
      obj.position.z -= delta;
      const type = obj.userData.type;

      // Spin coins
      if (type === 'coin') {
        obj.userData.spin += dt * 4;
        obj.rotation.z = obj.userData.spin;
        const bobY = 1.0 + Math.sin(time * 4 + obj.position.z) * 0.12;
        obj.position.y = bobY;
      }

      // Collision detection (only near player)
      if (obj.position.z > -1.5 && obj.position.z < 1.5) {
        const sameLane = obj.userData.lane === currentLane;

        if (type === 'coin' && sameLane) {
          scene.remove(obj);
          gameplayObjects.splice(i, 1);
          score += 25;
          scoreEl.textContent = Math.floor(score);
          continue;
        }

        if (type === 'pylon' && sameLane) {
          if (!obj.userData.hit) {
            obj.userData.hit = true;
            triggerHit();
          }
        }

        if (type === 'fascia' && sameLane) {
          // If player is NOT sliding, they hit it
          if (slideTimer <= 0 && !obj.userData.hit) {
            obj.userData.hit = true;
            triggerHit();
          }
        }
      }

      // Remove if too far behind
      if (obj.position.z < -15) {
        scene.remove(obj);
        gameplayObjects.splice(i, 1);
      }
    }

    // Truck chase
    if (truckActive && truckChaseTime > 0) {
      truckChaseTime -= dt;
      // Truck hovers behind character, matching his lane
      const targetZ = -10 + Math.sin(time * 6) * 0.5;
      truckGroup.position.x += (currentX * 0.8 - truckGroup.position.x) * Math.min(1, dt * 3);
      truckGroup.position.z += (targetZ - truckGroup.position.z) * Math.min(1, dt * 2);
      truckGroup.position.y = Math.sin(time * 12) * 0.08;

      // Headlight flicker
      headL.intensity = 2.5 + Math.sin(time * 20) * 1.5;
      headR.intensity = 2.5 + Math.sin(time * 20 + 1) * 1.5;

      if (truckChaseTime <= 0) {
        truckActive = false;
        truckGroup.visible = false;
      }
    }

    // Lane movement
    const dx = targetLaneX - currentX;
    currentX += dx * Math.min(1, dt * LANE_SWITCH_SPEED);
    character.position.x = currentX;

    const tiltTarget = -dx * 0.55;
    character.rotation.z += (tiltTarget - character.rotation.z) * Math.min(1, dt * 8);
    character.rotation.z = THREE.MathUtils.clamp(character.rotation.z, -MAX_TILT, MAX_TILT);

    // Slide animation (character squash)
    if (slideTimer > 0) {
      character.scale.y = 0.55;
      character.scale.x = 1.3;
      character.scale.z = 1.3;
    } else {
      character.scale.x += (1.15 - character.scale.x) * Math.min(1, dt * 10);
      character.scale.y += (1.15 - character.scale.y) * Math.min(1, dt * 10);
      character.scale.z += (1.15 - character.scale.z) * Math.min(1, dt * 10);
    }

    // Run animation
    const swing = Math.sin(time * 16) * 0.85;
    const bob = Math.abs(Math.sin(time * 16)) * 0.08;

    leftLeg.rotation.x = swing;
    rightLeg.rotation.x = -swing;
    leftArm.rotation.x = -swing * 0.9;
    rightArm.rotation.x = swing * 0.9;
    leftArm.rotation.z = 0.15;
    rightArm.rotation.z = -0.15;

    hips.position.y = 0.95 + bob;
    hips.rotation.y = Math.sin(time * 16) * 0.03;
    head.rotation.x = Math.sin(time * 16) * 0.05;

    // Camera
    camera.position.x += (currentX * 0.35 - camera.position.x) * Math.min(1, dt * 4);
    camera.position.y = CAM_BASE.y + Math.sin(time * 1.3) * 0.08;
    camera.lookAt(currentX * 0.5, 1.5, 15);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('loading').remove();
animate();
setTimeout(() => {
  const h = document.getElementById('hint');
  if (h) h.style.opacity = '0';
}, 8000);
</script>
