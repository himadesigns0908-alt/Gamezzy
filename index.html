<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamezzy Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 20px;
    color: #ff7a00;
    font: 800 24px system-ui, sans-serif;
    text-shadow: 0 0 16px rgba(255,120,0,0.9), 0 2px 12px rgba(0,0,0,1);
    pointer-events: none; z-index: 10;
    letter-spacing: 1px;
  }
  #hud .label { color: #aaa; font-size: 14px; font-weight: 600; }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #ff7a00;
    font: 800 24px system-ui, sans-serif;
    z-index: 100;
    letter-spacing: 2px;
  }
  #hint {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,122,0,0.7);
    font: 600 15px system-ui, sans-serif;
    text-shadow: 0 2px 8px #000;
    pointer-events: none; z-index: 10;
    transition: opacity 0.6s;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="loading">GAMEZZY RUNNER</div>
<div id="hud"><span class="label">SCORE</span> <span id="score">0</span></div>
<div id="hint">← → arrow keys · or swipe · to switch lanes</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const ORANGE = 0xff7a00;
const ORANGE_BRIGHT = 0xffaa33;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.018);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 3.4, -6.5);
camera.lookAt(0, 1.5, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

const skyGeo = new THREE.SphereGeometry(400, 32, 24);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x000000) },
    horizon: { value: new THREE.Color(0xff5500) },
    glowColor: { value: new THREE.Color(0xff2200) }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 horizon;
    uniform vec3 glowColor;
    varying vec3 vWorldPos;
    void main() {
      float h = normalize(vWorldPos).y;
      float band = exp(-abs(h) * 14.0);
      float glow = exp(-max(h, 0.0) * 3.5);
      vec3 color = topColor;
      color += horizon * band * 0.9;
      color += glowColor * glow * 0.25;
      vec3 dir = normalize(vWorldPos);
      float star = step(0.9985, fract(sin(dot(dir.xy, vec2(12.9898, 78.233))) * 43758.5453));
      color += vec3(star * 0.6);
      gl_FragColor = vec4(color, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

scene.add(new THREE.AmbientLight(0x331100, 0.6));

const orangeRim = new THREE.DirectionalLight(ORANGE, 1.8);
orangeRim.position.set(-12, 10, 25);
orangeRim.castShadow = true;
orangeRim.shadow.mapSize.set(2048, 2048);
orangeRim.shadow.camera.left = -25;
orangeRim.shadow.camera.right = 25;
orangeRim.shadow.camera.top = 25;
orangeRim.shadow.camera.bottom = -25;
orangeRim.shadow.camera.near = 1;
orangeRim.shadow.camera.far = 100;
orangeRim.shadow.bias = -0.0005;
scene.add(orangeRim);

const backRim = new THREE.DirectionalLight(0x220000, 0.4);
backRim.position.set(0, 5, -20);
scene.add(backRim);

const groundBounce = new THREE.DirectionalLight(ORANGE_BRIGHT, 0.35);
groundBounce.position.set(0, -5, 10);
scene.add(groundBounce);

const voidGround = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 1, metalness: 0 })
);
voidGround.rotation.x = -Math.PI / 2;
voidGround.position.y = -0.05;
voidGround.receiveShadow = true;
scene.add(voidGround);

function makeRoadTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#0a0a0e';
  x.fillRect(0, 0, size, size);
  const tiles = 6;
  const tileSize = size / tiles;
  for (let i = 0; i < tiles; i++) {
    for (let j = 0; j < tiles; j++) {
      const shade = 12 + Math.random() * 15;
      x.fillStyle = 'rgb(' + (shade + 6) + ',' + shade + ',' + (shade + 4) + ')';
      x.fillRect(i * tileSize + 2, j * tileSize + 2, tileSize - 4, tileSize - 4);
      x.strokeStyle = 'rgba(255, 100, 0, ' + (0.08 + Math.random() * 0.12) + ')';
      x.lineWidth = 1;
      x.strokeRect(i * tileSize + 2, j * tileSize + 2, tileSize - 4, tileSize - 4);
    }
  }
  x.strokeStyle = 'rgba(0,0,0,0.6)';
  x.lineWidth = 1;
  for (let i = 0; i < 40; i++) {
    x.beginPath();
    const px = Math.random() * size;
    const py = Math.random() * size;
    x.moveTo(px, py);
    for (let k = 0; k < 4; k++) {
      x.lineTo(px + (Math.random() - 0.5) * 60, py + (Math.random() - 0.5) * 60);
    }
    x.stroke();
  }
  for (let i = 0; i < 100; i++) {
    x.fillStyle = 'rgba(255, ' + (100 + Math.random() * 80) + ', 0, ' + (0.15 + Math.random() * 0.3) + ')';
    x.beginPath();
    x.arc(Math.random() * size, Math.random() * size, 1 + Math.random() * 2, 0, Math.PI * 2);
    x.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 40);
  tex.anisotropy = 8;
  return tex;
}

const ROAD_WIDTH = 10;
const ROAD_LENGTH = 600;

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH),
  new THREE.MeshStandardMaterial({
    map: makeRoadTexture(),
    roughness: 0.7,
    metalness: 0.3,
    color: 0xffffff
  })
);
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.01, ROAD_LENGTH / 2 - 30);
road.receiveShadow = true;
scene.add(road);

for (let lane = -1; lane <= 1; lane += 2) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(0.18, ROAD_LENGTH),
    new THREE.MeshBasicMaterial({ color: ORANGE })
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set(lane * (ROAD_WIDTH / 3), 0.03, ROAD_LENGTH / 2 - 30);
  scene.add(line);
}

function makeBrickTexture() {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#0a0a0c';
  x.fillRect(0, 0, size, size);
  const rows = 12;
  const brickH = size / rows;
  for (let r = 0; r < rows; r++) {
    const offset = (r % 2) * 32;
    for (let bx = -32; bx < size + 32; bx += 64) {
      const shade = 8 + Math.random() * 10;
      x.fillStyle = 'rgb(' + (shade + 4) + ',' + shade + ',' + (shade + 2) + ')';
      x.fillRect(bx + offset + 2, r * brickH + 2, 60, brickH - 4);
      x.fillStyle = 'rgba(255, 90, 0, ' + (0.05 + Math.random() * 0.15) + ')';
      x.fillRect(bx + offset, r * brickH, 62, 2);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 4);
  return tex;
}

const brickTex = makeBrickTexture();
const PILLAR_COUNT = 30;
const PILLAR_SPACING = 16;
const pillars = [];

const pillarMat = new THREE.MeshStandardMaterial({
  map: brickTex,
  roughness: 0.9,
  metalness: 0.1
});
const orangeGlowMat = new THREE.MeshBasicMaterial({ color: ORANGE });

for (let i = 0; i < PILLAR_COUNT; i++) {
  for (let side = -1; side <= 1; side += 2) {
    const group = new THREE.Group();

    const base = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.6, 2.4), pillarMat);
    base.position.y = 0.3;
    base.castShadow = true;
    base.receiveShadow = true;
    group.add(base);

    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.0, 7, 8), pillarMat);
    shaft.position.y = 4.1;
    shaft.castShadow = true;
    shaft.receiveShadow = true;
    group.add(shaft);

    for (let r = 0; r < 3; r++) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.06, 8, 20), orangeGlowMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 1.5 + r * 2.5;
      group.add(ring);
    }

    const cap = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.5, 2.5), pillarMat);
    cap.position.y = 7.9;
    cap.castShadow = true;
    group.add(cap);

    const glowTop = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, 0.1, 2.6),
      new THREE.MeshBasicMaterial({ color: ORANGE_BRIGHT })
    );
    glowTop.position.y = 8.19;
    group.add(glowTop);

    const light = new THREE.PointLight(ORANGE, 0.9, 12);
    light.position.y = 8.4;
    group.add(light);

    group.position.set(side * (ROAD_WIDTH / 2 + 2.2), 0, i * PILLAR_SPACING);
    scene.add(group);
    pillars.push(group);
  }
}

const character = new THREE.Group();
character.position.set(0, 0, 0);
character.scale.setScalar(1.15);
scene.add(character);

const SHIRT_COLOR = ORANGE;
const SKIN_COLOR = 0xf0b088;
const PANTS_COLOR = 0x101018;
const SHOE_COLOR = 0x1a1a22;

const shirtMat = new THREE.MeshStandardMaterial({ color: SHIRT_COLOR, roughness: 0.55, emissive: 0x220800, emissiveIntensity: 0.6 });
const skinMat = new THREE.MeshStandardMaterial({ color: SKIN_COLOR, roughness: 0.75 });
const pantsMat = new THREE.MeshStandardMaterial({ color: PANTS_COLOR, roughness: 0.9 });
const shoeMat = new THREE.MeshStandardMaterial({ color: SHOE_COLOR, roughness: 0.5 });

const hips = new THREE.Group();
hips.position.y = 0.95;
character.add(hips);

const torso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.85, 0.42), shirtMat);
torso.position.y = 0.42;
torso.castShadow = true;
hips.add(torso);

const chestStripe = new THREE.Mesh(
  new THREE.BoxGeometry(0.75, 0.06, 0.44),
  new THREE.MeshBasicMaterial({ color: ORANGE_BRIGHT })
);
chestStripe.position.y = 0.5;
hips.add(chestStripe);

const shoulders = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.28, 0.44), shirtMat);
shoulders.position.y = 0.78;
shoulders.castShadow = true;
hips.add(shoulders);

const dpCanvas = document.createElement('canvas');
dpCanvas.width = dpCanvas.height = 256;
const dpx = dpCanvas.getContext('2d');
dpx.clearRect(0, 0, 256, 256);
dpx.beginPath();
dpx.arc(128, 128, 95, 0, Math.PI * 2);
dpx.fillStyle = '#000000';
dpx.fill();
dpx.lineWidth = 10;
dpx.strokeStyle = '#ff7a00';
dpx.stroke();
dpx.fillStyle = '#ffffff';
dpx.font = 'bold 100px system-ui, sans-serif';
dpx.textAlign = 'center';
dpx.textBaseline = 'middle';
dpx.fillText('DP', 128, 142);
const dpTex = new THREE.CanvasTexture(dpCanvas);
const dpLogo = new THREE.Mesh(
  new THREE.PlaneGeometry(0.55, 0.55),
  new THREE.MeshBasicMaterial({ map: dpTex, transparent: true })
);
dpLogo.position.set(0, 0.42, -0.221);
dpLogo.rotation.y = Math.PI;
hips.add(dpLogo);

const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.14, 8), skinMat);
neck.position.y = 1.02;
hips.add(neck);

const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.46, 0.42), skinMat);
head.position.y = 1.35;
head.castShadow = true;
hips.add(head);

const hair = new THREE.Mesh(
  new THREE.BoxGeometry(0.46, 0.14, 0.46),
  new THREE.MeshStandardMaterial({ color: 0x1a0f08, roughness: 0.95 })
);
hair.position.y = 1.58;
hips.add(hair);

function makeArm(side) {
  const arm = new THREE.Group();
  arm.position.set(side * 0.5, 0.85, 0);
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.45, 8), shirtMat);
  upper.position.y = -0.22;
  upper.castShadow = true;
  arm.add(upper);
  const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.42, 8), skinMat);
  lower.position.y = -0.65;
  lower.castShadow = true;
  arm.add(lower);
  const hand = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.12), skinMat);
  hand.position.y = -0.9;
  hand.castShadow = true;
  arm.add(hand);
  hips.add(arm);
  return arm;
}
const leftArm = makeArm(-1);
const rightArm = makeArm(1);

function makeLeg(side) {
  const leg = new THREE.Group();
  leg.position.set(side * 0.19, 0, 0);
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.11, 0.5, 8), pantsMat);
  upper.position.y = -0.28;
  upper.castShadow = true;
  leg.add(upper);
  const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.45, 8), pantsMat);
  lower.position.y = -0.78;
  lower.castShadow = true;
  leg.add(lower);
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.13, 0.36), shoeMat);
  shoe.position.set(0, -1.04, 0.07);
  shoe.castShadow = true;
  leg.add(shoe);
  hips.add(leg);
  return leg;
}
const leftLeg = makeLeg(-1);
const rightLeg = makeLeg(1);

const blob = new THREE.Mesh(
  new THREE.CircleGeometry(0.75, 32),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.65 })
);
blob.rotation.x = -Math.PI / 2;
blob.position.y = 0.01;
character.add(blob);

const charGlow = new THREE.Mesh(
  new THREE.CircleGeometry(0.9, 32),
  new THREE.MeshBasicMaterial({ color: ORANGE, transparent: true, opacity: 0.25 })
);
charGlow.rotation.x = -Math.PI / 2;
charGlow.position.y = 0.005;
character.add(charGlow);

const stripes = [];
const stripeGeo = new THREE.PlaneGeometry(0.5, 3.5);
const stripeMat = new THREE.MeshBasicMaterial({
  color: ORANGE, transparent: true, opacity: 0.4
});
for (let i = 0; i < 70; i++) {
  const s = new THREE.Mesh(stripeGeo, stripeMat);
  s.rotation.x = -Math.PI / 2;
  s.position.set((Math.floor(Math.random() * 3) - 1) * (ROAD_WIDTH / 3), 0.04, i * 8);
  scene.add(s);
  stripes.push(s);
}

const LANE_X = [-ROAD_WIDTH / 3, 0, ROAD_WIDTH / 3];
let currentLane = 1;
let targetLaneX = LANE_X[currentLane];
let currentX = LANE_X[currentLane];
const LANE_SWITCH_SPEED = 12;
const MAX_TILT = 0.35;

function switchLane(direction) {
  const next = currentLane + direction;
  if (next < 0 || next > 2) return;
  currentLane = next;
  targetLaneX = LANE_X[currentLane];
  const hint = document.getElementById('hint');
  if (hint) hint.style.opacity = '0';
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    e.preventDefault();
    switchLane(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    e.preventDefault();
    switchLane(1);
  }
});

let touchStartX = 0;
let touchStartY = 0;
window.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
    switchLane(dx > 0 ? 1 : -1);
  }
});

let speed = 15;
let score = 0;
let time = 0;
const scoreEl = document.getElementById('score');
const clock = new THREE.Clock();
const CAM_BASE = new THREE.Vector3(0, 3.4, -6.5);

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  const delta = speed * dt;
  score += delta * 0.8;
  scoreEl.textContent = Math.floor(score);

  pillars.forEach(p => {
    p.position.z -= delta;
    if (p.position.z < -30) {
      p.position.z += PILLAR_COUNT * PILLAR_SPACING;
    }
  });

  stripes.forEach(s => {
    s.position.z -= delta;
    if (s.position.z < -15) s.position.z += 560;
  });

  const dx = targetLaneX - currentX;
  currentX += dx * Math.min(1, dt * LANE_SWITCH_SPEED);
  character.position.x = currentX;

  const tiltTarget = -dx * 0.55;
  character.rotation.z += (tiltTarget - character.rotation.z) * Math.min(1, dt * 8);
  character.rotation.z = THREE.MathUtils.clamp(character.rotation.z, -MAX_TILT, MAX_TILT);

  const swing = Math.sin(time * 16) * 0.85;
  const bob = Math.abs(Math.sin(time * 16)) * 0.08;

  leftLeg.rotation.x = swing;
  rightLeg.rotation.x = -swing;
  leftArm.rotation.x = -swing * 0.9;
  rightArm.rotation.x = swing * 0.9;
  leftArm.rotation.z = 0.15;
  rightArm.rotation.z = -0.15;

  hips.position.y = 0.95 + bob;
  hips.rotation.y = Math.sin(time * 16) * 0.03;
  head.rotation.x = Math.sin(time * 16) * 0.05;

  camera.position.x += (currentX * 0.35 - camera.position.x) * Math.min(1, dt * 4);
  camera.position.y = CAM_BASE.y + Math.sin(time * 1.3) * 0.08;
  camera.lookAt(currentX * 0.5, 1.5, 15);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('loading').remove();
animate();
setTimeout(() => {
  const h = document.getElementById('hint');
  if (h) h.style.opacity = '0';
}, 6000);
</script>
</body>
</html>
