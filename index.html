<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamezzy Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 20px;
    color: #ff7a00;
    font: 800 24px system-ui, sans-serif;
    text-shadow: 0 0 16px rgba(255,120,0,0.9), 0 2px 12px rgba(0,0,0,1);
    pointer-events: none; z-index: 10;
    letter-spacing: 1px;
  }
  #hud .label { color: #aaa; font-size: 14px; font-weight: 600; }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #ff7a00;
    font: 800 24px system-ui, sans-serif;
    z-index: 100;
    letter-spacing: 2px;
  }
  #hint {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,122,0,0.7);
    font: 600 15px system-ui, sans-serif;
    text-shadow: 0 2px 8px #000;
    pointer-events: none; z-index: 10;
    transition: opacity 0.6s;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="loading">GAMEZZY RUNNER</div>
<div id="hud"><span class="label">SCORE</span> <span id="score">0</span></div>
<div id="hint">← → arrow keys · or swipe · to switch lanes</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// ORANGE + BLACK THEME CONSTANTS
// ============================================================
const ORANGE       = 0xff7a00;
const ORANGE_BRIGHT= 0xffaa33;
const BLACK        = 0x050505;
const DARK         = 0x101015;

// ============================================================
// 1. SCENE + CAMERA + RENDERER
// ============================================================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.018);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  400
);
camera.position.set(0, 3.4, -6.5);
camera.lookAt(0, 1.5, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

// ============================================================
// 2. SKY — pure black with orange horizon glow
// ============================================================
const skyGeo = new THREE.SphereGeometry(400, 32, 24);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor:    { value: new THREE.Color(0x000000) },
    horizon:     { value: new THREE.Color(0xff5500) },
    glowColor:   { value: new THREE.Color(0xff2200) }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 horizon;
    uniform vec3 glowColor;
    varying vec3 vWorldPos;
    void main() {
      float h = normalize(vWorldPos).y;
      // Slight orange band around horizon (h ~ 0)
      float band = exp(-abs(h) * 14.0);
      float glow = exp(-max(h, 0.0) * 3.5);
      vec3 color = topColor;
      color += horizon * band * 0.9;
      color += glowColor * glow * 0.25;
      // Add subtle star field
      vec3 dir = normalize(vWorldPos);
      float star = step(0.9985, fract(sin(dot(dir.xy, vec2(12.9898, 78.233))) * 43758.5453));
      color += vec3(star * 0.6);
      gl_FragColor = vec4(color, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// ============================================================
// 3. LIGHTING — dramatic orange rim + dim ambient
// ============================================================
scene.add(new THREE.AmbientLight(0x331100, 0.6));

const orangeRim = new THREE.DirectionalLight(ORANGE, 1.8);
orangeRim.position.set(-12, 10, 25);
orangeRim.castShadow = true;
orangeRim.shadow.mapSize.set(2048, 2048);
orangeRim.shadow.camera.left = -25;
orangeRim.shadow.camera.right = 25;
orangeRim.shadow.camera.top = 25;
orangeRim.shadow.camera.bottom = -25;
orangeRim.shadow.camera.near = 1;
orangeRim.shadow.camera.far = 100;
orangeRim.shadow.bias = -0.0005;
scene.add(orangeRim);

// Cool back rim for silhouette pop
const backRim = new THREE.DirectionalLight(0x220000, 0.4);
backRim.position.set(0, 5, -20);
scene.add(backRim);

// Faint orange ground bounce
const groundBounce = new THREE.DirectionalLight(ORANGE_BRIGHT, 0.35);
groundBounce.position.set(0, -5, 10);
scene.add(groundBounce);

// ============================================================
// 4. GROUND — pure black void + procedural dark stone road
// ============================================================
const VOID_GROUND = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 1, metalness: 0 })
);
VOID_GROUND.rotation.x = -Math.PI / 2;
VOID_GROUND.position.y = -0.05;
VOID_GROUND.receiveShadow = true;
scene.add(VOID_GROUND);

// Road texture — dark stone with orange seams
function makeRoadTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');

  // Base dark stone
  x.fillStyle = '#0a0a0e';
  x.fillRect(0, 0, size, size);

  const tiles = 6;
  const tileSize = size / tiles;
  for (let i = 0; i < tiles; i++) {
    for (let j = 0; j < tiles; j++) {
      const shade = 12 + Math.random() * 15;
      x.fillStyle = `rgb(${shade + 6}, ${shade}, ${shade + 4})`;
      x.fillRect(i * tileSize + 2, j * tileSize + 2, tileSize - 4, tileSize - 4);

      // Subtle orange highlight on tile edges
      x.strokeStyle = `rgba(255, 100, 0, ${0.08 + Math.random() * 0.12})`;
      x.lineWidth = 1;
      x.strokeRect(i * tileSize + 2, j * tileSize + 2, tileSize - 4, tileSize - 4);
    }
  }

  // Cracks (dark)
  x.strokeStyle = 'rgba(0,0,0,0.6)';
  x.lineWidth = 1;
  for (let i = 0; i < 40; i++) {
    x.beginPath();
    const px = Math.random() * size;
    const py = Math.random() * size;
    x.moveTo(px, py);
    for (let k = 0; k < 4; k++) {
      x.lineTo(px + (Math.random() - 0.5) * 60, py + (Math.random() - 0.5) * 60);
    }
    x.stroke();
  }

  // Faint ember specks
  for (let i = 0; i < 100; i++) {
    x.fillStyle = `rgba(255, ${100 + Math.random() * 80}, 0, ${0.15 + Math.random() * 0.3})`;
    x.beginPath();
    x.arc(Math.random() * size, Math.random() * size, 1 + Math.random() * 2, 0, Math.PI * 2);
    x.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 40);
  tex.anisotropy = 8;
  return tex;
}

const ROAD_WIDTH = 10;
const ROAD_LENGTH = 600;

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH),
  new THREE.MeshStandardMaterial({
    map: makeRoadTexture(),
    roughness: 0.7,
    metalness: 0.3,
    color: 0xffffff
  })
);
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.01, ROAD_LENGTH / 2 - 30);
road.receiveShadow = true;
scene.add(road);

// Orange glowing lane lines
for (let lane = -1; lane <= 1; lane += 2) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(0.18, ROAD_LENGTH),
    new THREE.MeshBasicMaterial({ color: ORANGE })
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set(lane * (ROAD_WIDTH / 3), 0.03, ROAD_LENGTH / 2 - 30);
  scene.add(line);
}
