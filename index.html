<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamezzy Runner — Lanka</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 20px;
    color: #ff7a00;
    font: 800 24px system-ui, sans-serif;
    text-shadow: 0 0 16px rgba(255,120,0,0.9), 0 2px 12px rgba(0,0,0,1);
    pointer-events: none; z-index: 10; letter-spacing: 1px;
  }
  #hud .label { color: #ffcc99; font-size: 14px; font-weight: 600; }
  #zone {
    position: fixed; top: 16px; right: 20px;
    color: #ffcc44; font: 800 20px system-ui, sans-serif;
    text-shadow: 0 0 12px rgba(255,180,0,0.9), 0 2px 10px rgba(0,0,0,1);
    pointer-events: none; z-index: 10; letter-spacing: 3px;
    text-transform: uppercase; transition: opacity 0.5s;
  }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #ff7a00;
    font: 800 24px system-ui, sans-serif;
    z-index: 100; letter-spacing: 2px;
  }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,200,80,0.8); font: 600 15px system-ui, sans-serif;
    text-shadow: 0 2px 8px #000; pointer-events: none; z-index: 10;
    transition: opacity 0.6s; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="loading">GAMEZZY RUNNER · LANKA</div>
<div id="hud"><span class="label">SCORE</span> <span id="score">0</span></div>
<div id="zone">BEACH</div>
<div id="hint">← → arrow keys · swipe · switch lanes</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// Zone configs
const ZONES = [
  { name: 'BEACH',
    skyTop: 0x0a1a4a, skyMid: 0x3a6aaa, skyHorizon: 0xffaa55,
    fog: 0x2a2a4a, fogDensity: 0.020,
    ambient: 0x443355, sun: 0xffbb77,
    roadColor: 0x9a7a5a, lineColor: 0xffdd66,
    decor: 'beach', duration: 30 },
  { name: 'JUNGLE',
    skyTop: 0x051a10, skyMid: 0x2a5a30, skyHorizon: 0x88cc66,
    fog: 0x0a2010, fogDensity: 0.030,
    ambient: 0x224422, sun: 0xbbff88,
    roadColor: 0x4a5a3a, lineColor: 0xaaff66,
    decor: 'jungle', duration: 30 },
  { name: 'TEMPLE',
    skyTop: 0x1a0510, skyMid: 0x5a0a0a, skyHorizon: 0xff4400,
    fog: 0x3a0a0a, fogDensity: 0.018,
    ambient: 0x553300, sun: 0xff7733,
    roadColor: 0x2a1a1a, lineColor: 0xffaa33,
    decor: 'temple', duration: 30 },
  { name: 'FESTIVAL',
    skyTop: 0x1a0525, skyMid: 0x5a0a5a, skyHorizon: 0xff44cc,
    fog: 0x2a0a2a, fogDensity: 0.016,
    ambient: 0x553377, sun: 0xff99ee,
    roadColor: 0x3a2a4a, lineColor: 0xffaaff,
    decor: 'festival', duration: 30 }
];

let currentZone = 0;
let zoneElapsed = 0;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x2a2a4a, 0.020);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 3.4, -6.5);
camera.lookAt(0, 1.5, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

// SKY
const skyUniforms = {
  topColor: { value: new THREE.Color(0x0a1a4a) },
  midColor: { value: new THREE.Color(0x3a6aaa) },
  horizon:  { value: new THREE.Color(0xffaa55) }
};

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: skyUniforms,
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 horizon;
    varying vec3 vWorldPos;
    void main() {
      float h = normalize(vWorldPos).y;
      vec3 color;
      if (h > 0.0) {
        color = mix(midColor, topColor, pow(h, 0.55));
      } else {
        color = mix(midColor, horizon, pow(-h, 0.45));
      }
      float band = exp(-abs(h) * 12.0);
      color += horizon * band * 0.5;
      vec3 dir = normalize(vWorldPos);
      float star = step(0.9985, fract(sin(dot(dir.xy, vec2(12.9898, 78.233))) * 43758.5453));
      color += vec3(star * 0.55);
      gl_FragColor = vec4(color, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 24), skyMat));

// LIGHTS
const ambientLight = new THREE.AmbientLight(0x443355, 0.7);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffbb77, 1.7);
sunLight.position.set(-12, 12, 25);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -25;
sunLight.shadow.camera.right = 25;
sunLight.shadow.camera.top = 25;
sunLight.shadow.camera.bottom = -25;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 100;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

const backRim = new THREE.DirectionalLight(0x442200, 0.4);
backRim.position.set(0, 5, -20);
scene.add(backRim);

// GROUND + ROAD
const voidGround = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 1 })
);
voidGround.rotation.x = -Math.PI / 2;
voidGround.position.y = -0.05;
voidGround.receiveShadow = true;
scene.add(voidGround);

function makeRoadTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#0a0a0e';
  x.fillRect(0, 0, size, size);
  const tiles = 6;
  const tileSize = size / tiles;
  for (let i = 0; i < tiles; i++) {
    for (let j = 0; j < tiles; j++) {
      const shade = 12 + Math.random() * 20;
      x.fillStyle = 'rgb(' + (shade + 8) + ',' + shade + ',' + (shade + 6) + ')';
      x.fillRect(i * tileSize + 2, j * tileSize + 2, tileSize - 4, tileSize - 4);
      x.strokeStyle = 'rgba(255, 180, 90, ' + (0.12 + Math.random() * 0.15) + ')';
      x.lineWidth = 1;
      x.strokeRect(i * tileSize + 2, j * tileSize + 2, tileSize - 4, tileSize - 4);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 40);
  tex.anisotropy = 8;
  return tex;
}

const ROAD_WIDTH = 10;
const ROAD_LENGTH = 700;

const roadMaterial = new THREE.MeshStandardMaterial({
  map: makeRoadTexture(), roughness: 0.75, metalness: 0.15, color: 0xffffff
});

const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH), roadMaterial);
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.01, ROAD_LENGTH / 2 - 30);
road.receiveShadow = true;
scene.add(road);

const laneLineMat = new THREE.MeshBasicMaterial({ color: 0xffdd66 });
for (let lane = -1; lane <= 1; lane += 2) {
  const line = new THREE.Mesh(new THREE.PlaneGeometry(0.18, ROAD_LENGTH), laneLineMat);
  line.rotation.x = -Math.PI / 2;
  line.position.set(lane * (ROAD_WIDTH / 3), 0.03, ROAD_LENGTH / 2 - 30);
  scene.add(line);
}

// PILLARS
const PILLAR_COUNT = 30;
const PILLAR_SPACING = 16;
const pillars = [];

const pillarMat = new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.9, metalness: 0.1 });
const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa33 });

for (let i = 0; i < PILLAR_COUNT; i++) {
  for (let side = -1; side <= 1; side += 2) {
    const group = new THREE.Group();

    const base = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.6, 2.4), pillarMat);
    base.position.y = 0.3;
    base.castShadow = true;
    base.receiveShadow = true;
    group.add(base);

    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.0, 7, 8), pillarMat);
    shaft.position.y = 4.1;
    shaft.castShadow = true;
    shaft.receiveShadow = true;
    group.add(shaft);

    for (let r = 0; r < 3; r++) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.06, 8, 20), glowMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 1.5 + r * 2.5;
      group.add(ring);
    }

    const cap = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.5, 2.5), pillarMat);
    cap.position.y = 7.9;
    cap.castShadow = true;
    group.add(cap);

    const glowTop = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.1, 2.6), glowMat);
    glowTop.position.y = 8.19;
    group.add(glowTop);

    const lamp = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xffdd55 })
    );
    lamp.position.y = 8.55;
    group.add(lamp);

    const light = new THREE.PointLight(0xffbb55, 1.0, 14);
    light.position.y = 8.55;
    group.add(light);

    group.userData.lamp = lamp;

    group.position.set(side * (ROAD_WIDTH / 2 + 2.2), 0, i * PILLAR_SPACING);
    scene.add(group);
    pillars.push(group);
  }
}
