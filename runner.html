<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gamezzy Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #fff;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  #wrap { position: relative; }
  canvas {
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: block;
  }
  #hud {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 18px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #hud .score { color: #4ade80; }
  #hud .best  { color: #facc15; }
  #start, #gameover {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,15,0.85);
    border-radius: 12px;
    text-align: center;
    gap: 14px;
  }
  #start h1 { font-size: 42px; background: linear-gradient(90deg,#4ade80,#22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  #start p, #gameover p { color: #94a3b8; font-size: 15px; }
  button {
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 700;
    background: #4ade80;
    color: #0a0a0f;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .1s;
  }
  button:hover { transform: scale(1.05); }
  #gameover { display: none; }
  #gameover h2 { font-size: 36px; color: #ef4444; }
  #gameover .final { font-size: 22px; color: #4ade80; font-weight: 700; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="400"></canvas>
  <div id="hud">
    <div class="score">SCORE: <span id="score">0</span></div>
    <div class="best">BEST: <span id="best">0</span></div>
  </div>
  <div id="start">
    <h1>GAMEZZY RUNNER</h1>
    <p>Press SPACE or CLICK to jump · Double-jump supported</p>
    <button id="startBtn">Start Run</button>
  </div>
  <div id="gameover">
    <h2>GAME OVER</h2>
    <div class="final">Score: <span id="finalScore">0</span></div>
    <p>Press SPACE to try again</p>
    <button id="retryBtn">Try Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND_Y = H - 60;

let state = 'menu'; // menu | playing | dead
let score = 0;
let best = parseInt(localStorage.getItem('gamezzy_best') || '0');
document.getElementById('best').textContent = best;

// ---------- Player ----------
const player = {
  x: 120, y: GROUND_Y, w: 40, h: 50,
  vy: 0, jumps: 0,
  maxJumps: 2,
  gravity: 0.9,
  jumpForce: -15,
  color: '#4ade80',
  legPhase: 0
};

// ---------- World ----------
let obstacles = [];
let particles = [];
let clouds = [];
let groundOffset = 0;
let speed = 6;
let spawnTimer = 0;
let spawnInterval = 90; // frames
let frame = 0;

// ---------- Input ----------
function jump() {
  if (state === 'menu') { startGame(); return; }
  if (state === 'dead') { startGame(); return; }
  if (player.jumps < player.maxJumps) {
    player.vy = player.jumpForce;
    player.jumps++;
    burst(player.x + player.w/2, player.y + player.h, 8, '#4ade80');
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    jump();
  }
});
canvas.addEventListener('mousedown', jump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });
document.getElementById('startBtn').onclick = e => { e.stopPropagation(); startGame(); };
document.getElementById('retryBtn').onclick = e => { e.stopPropagation(); startGame(); };

// ---------- Particles ----------
function burst(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 1) * 4,
      life: 1,
      size: 3 + Math.random() * 3,
      color
    });
  }
}

// ---------- Clouds ----------
function initClouds() {
  clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 40 + Math.random() * 120,
      r: 20 + Math.random() * 30,
      speed: 0.3 + Math.random() * 0.5
    });
  }
}

// ---------- Game flow ----------
function startGame() {
  state = 'playing';
  score = 0;
  speed = 6;
  spawnTimer = 0;
  spawnInterval = 90;
  obstacles = [];
  particles = [];
  player.y = GROUND_Y;
  player.vy = 0;
  player.jumps = 0;
  frame = 0;
  initClouds();
  document.getElementById('start').style.display = 'none';
  document.getElementById('gameover').style.display = 'none';
  document.getElementById('score').textContent = '0';
}

function die() {
  state = 'dead';
  burst(player.x + player.w/2, player.y + player.h/2, 30, '#ef4444');
  if (score > best) {
    best = Math.floor(score);
    localStorage.setItem('gamezzy_best', best);
    document.getElementById('best').textContent = best;
  }
  document.getElementById('finalScore').textContent = Math.floor(score);
  document.getElementById('gameover').style.display = 'flex';
}

// ---------- Update ----------
function update() {
  if (state !== 'playing') return;

  frame++;
  speed += 0.0015; // gradual difficulty ramp
  score += speed * 0.15;
  document.getElementById('score').textContent = Math.floor(score);

  // Player physics
  player.vy += player.gravity;
  player.y += player.vy;
  if (player.y >= GROUND_Y) {
    player.y = GROUND_Y;
    player.vy = 0;
    player.jumps = 0;
  }
  player.legPhase += 0.4 * (speed / 6);

  // Spawn obstacles
  spawnTimer++;
  spawnInterval = Math.max(50, 90 - speed * 3);
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    const tall = Math.random() < 0.3;
    obstacles.push({
      x: W + 40,
      y: GROUND_Y + player.h - (tall ? 70 : 40),
      w: tall ? 28 : 36,
      h: tall ? 70 : 40,
      color: tall ? '#ef4444' : '#f97316'
    });
  }

  // Move obstacles + collision
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed;
    if (o.x + o.w < 0) { obstacles.splice(i, 1); continue; }

    // AABB collision
    if (
      player.x + player.w - 8 > o.x &&
      player.x + 8 < o.x + o.w &&
      player.y + player.h > o.y &&
      player.y < o.y + o.h
    ) {
      die();
      return;
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.3;
    p.life -= 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Clouds
  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x + c.r < 0) { c.x = W + c.r; c.y = 40 + Math.random() * 120; }
  });

  groundOffset = (groundOffset + speed) % 40;
}

// ---------- Draw ----------
function drawCloud(c) {
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath();
  ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
  ctx.arc(c.x + c.r * 0.7, c.y + 5, c.r * 0.8, 0, Math.PI * 2);
  ctx.arc(c.x - c.r * 0.7, c.y + 5, c.r * 0.7, 0, Math.PI * 2);
  ctx.fill();
}

function drawGround() {
  // Ground line
  ctx.strokeStyle = '#22d3ee';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y + player.h);
  ctx.lineTo(W, GROUND_Y + player.h);
  ctx.stroke();

  // Moving stripes
  ctx.strokeStyle = 'rgba(34,211,238,0.3)';
  ctx.lineWidth = 2;
  for (let x = -groundOffset; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y + player.h + 8);
    ctx.lineTo(x + 20, GROUND_Y + player.h + 8);
    ctx.stroke();
  }
}

function drawPlayer() {
  const px = player.x, py = player.y;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(px + player.w/2, GROUND_Y + player.h + 4, player.w * 0.6, 6, 0, 0, Math.PI*2);
  ctx.fill();

  // Body
  ctx.fillStyle = player.color;
  ctx.shadowColor = player.color;
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.roundRect(px, py, player.w, player.h, 10);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Eye
  ctx.fillStyle = '#0a0a0f';
  ctx.beginPath();
  ctx.arc(px + player.w - 12, py + 16, 5, 0, Math.PI*2);
  ctx.fill();

  // Animated legs
  const swing = Math.sin(player.legPhase) * 8;
  ctx.strokeStyle = player.color;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px + 10, py + player.h);
  ctx.lineTo(px + 10 + swing, py + player.h + 8);
  ctx.moveTo(px + player.w - 10, py + player.h);
  ctx.lineTo(px + player.w - 10 - swing, py + player.h + 8);
  ctx.stroke();
}

function drawObstacle(o) {
  ctx.fillStyle = o.color;
  ctx.shadowColor = o.color;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.roundRect(o.x, o.y, o.w, o.h, 6);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Spike detail
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.roundRect(o.x + 4, o.y + 4, o.w - 8, 6, 3);
  ctx.fill();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background gradient handled by CSS, but add stars
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 30; i++) {
    const sx = (i * 137 + frame * 0.3) % W;
    const sy = (i * 53) % (GROUND_Y - 60);
    ctx.fillRect(sx, sy, 2, 2);
  }

  clouds.forEach(drawCloud);
  drawGround();
  obstacles.forEach(drawObstacle);
  drawPlayer();
  drawParticles();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Boot
initClouds();
loop();
</script>
</body>
</html>
