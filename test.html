<!DOCTYPE html>
<html>
<head>
  <title>My First 3D</title>
  <style>
    body { margin: 0; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// 1. SCENE — the empty table
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111122);

// 2. CAMERA — our eyes
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 5);
camera.lookAt(0, 0, 0);

// 3. RENDERER — the thing that takes the photo
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 4. LIGHT — a lamp
const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(5, 10, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x444466));

// 5. MESH — a brick (this one is a cube)
const geometry = new THREE.BoxGeometry(1, 1, 1);
const material = new THREE.MeshStandardMaterial({ color: 0xff6a1a });
const cube = new THREE.Mesh(geometry, material);
scene.add(cube);

// 6. LOOP — take photos 60 times per second
function animate() {
  cube.rotation.x += 0.01;
  cube.rotation.y += 0.01;
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
